name: Build SA Viewer for iOS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_ipa:
        description: "打包未签名 IPA"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: iOS arm64 build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version | head -1
          xcrun -sdk iphoneos metal --version 2>&1 | head -2 || true

      - name: Configure (iOS arm64)
        run: |
          set -euo pipefail
          cp Info.plist.in Info.plist
          cmake -S . -B build/ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_BUILD_TYPE=Release \
            -DSA_BUILD_IOS=ON \
            -G "Unix Makefiles"

      - name: Build app bundle
        run: |
          set -o pipefail
          cmake --build build/ios --target SAViewer -j4 2>&1 | tee "$RUNNER_TEMP/build.log"
          echo "### 构建结果" >> "$GITHUB_STEP_SUMMARY"

      - name: Inspect and verify
        if: always()
        run: |
          echo '### 产物检查' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          APP=build/ios/SAViewer.app
          if [ -d "$APP" ]; then
            ls -la "$APP"
            echo "--- arch"
            xcrun lipo -info "$APP/SAViewer" || true
            echo "--- platforms"
            xcrun otool -l "$APP/SAViewer" | grep -A4 LC_BUILD_VERSION | head -6 || true
            echo "--- linked"
            xcrun otool -L "$APP/SAViewer" | head -12 || true
            echo "--- metallib"
            [ -f "$APP/default.metallib" ] && echo "default.metallib: $(stat -f%z "$APP/default.metallib") bytes" || echo "MISSING default.metallib"
            echo "--- plist"
            plutil -p "$APP/Info.plist" 2>/dev/null | head -12 || true
          else
            echo "SAViewer.app 未生成"
          fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Pack unsigned IPA
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.make_ipa }}
        run: |
          set -euo pipefail
          APP=build/ios/SAViewer.app
          [ -d "$APP" ] || { echo "没有 app，跳过打包"; exit 0; }
          rm -rf "$RUNNER_TEMP/pack"
          mkdir -p "$RUNNER_TEMP/pack/Payload"
          cp -R "$APP" "$RUNNER_TEMP/pack/Payload/"
          ( cd "$RUNNER_TEMP/pack" && zip -qry "$RUNNER_TEMP/SAViewer-unsigned.ipa" Payload )
          ls -l "$RUNNER_TEMP/SAViewer-unsigned.ipa"
          shasum -a 256 "$RUNNER_TEMP/SAViewer-unsigned.ipa"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sa-viewer-ios
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.ipa
          if-no-files-found: warn
          retention-days: 14
